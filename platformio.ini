; ============================================================================
;  通用 USB 无线打印服务器固件  (ESP32-S3 / Arduino-ESP32 3.3.0)
;
;  两个环境，同一份源码：
;    pio run -e release     正式版：剔除 FWLOGD 观测点，串口只留事件/异常
;    pio run -e debug       调试版：全量日志（逐请求、逐作业、轮询、内存快照）
;
;  构建产物：
;    .pio/build/release/firmware.bin
;    .pio/build/debug/firmware.bin
;  一键出两套镜像： scripts/build_all.sh  (Windows: scripts\build_all.bat)
; ============================================================================
[platformio]
default_envs = release

[env]
platform    = espressif32
; 目标板 ESP32-S3 N16R8: 16MB Flash (QIO) + 8MB OPI PSRAM。
; 该官方板定义会启用 CONFIG_SPIRAM / BOARD_HAS_PSRAM / qio_opi 库变体。
; 换板: N8R8 -> esp32-s3-devkitc1-n8r8 ; 无 PSRAM -> esp32-s3-devkitc-1
board       = esp32-s3-devkitc1-n16r8
framework   = arduino
monitor_speed = 115200

; 关键: native USB 必须留给 USB Host 使用, 不能启动 USB CDC/MSC/DFU 设备
build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MSC_ON_BOOT=1
    -DARDUINO_USB_DFU_ON_BOOT=1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DARDUINO_USB_DFU_ON_BOOT=0
    -Wall

; 换板只需改上面的 board 一行：flash 尺寸、分区表、PSRAM 库变体会一起切换。
; spool 容量/水位等参数在 src/config.h。

; ---- 正式版：去掉观测点 ------------------------------------------------
; FW_DEBUG=0 让 FWLOGD(...) 编译为空（参数不求值，不占 Flash / CPU）；
; CORE_DEBUG_LEVEL=1 只保留 Arduino/IDF 内核的 ERROR 级输出。
[env:release]
build_flags =
    ${env.build_flags}
    -DFW_DEBUG=0
    -DCORE_DEBUG_LEVEL=1

; ---- 调试版：全量日志 --------------------------------------------------
; CORE_DEBUG_LEVEL=4 打开内核 verbose，便于看 Wi-Fi / lwIP / USB 栈的行为。
[env:debug]
build_flags =
    ${env.build_flags}
    -DFW_DEBUG=1
    -DCORE_DEBUG_LEVEL=4
